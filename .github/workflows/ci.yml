name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: Test (race, shuffle)
        run: go test ./... -race -shuffle=on -count=1
      - name: go mod tidy check
        run: go mod tidy && git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint (new issues only)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          only-new-issues: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # govulncheck@latest needs a recent toolchain; the module targets an
      # older Go on purpose, so this job uses stable instead of go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
      - name: govulncheck (bloquea)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci --no-fund --no-audit
      - name: build
        run: npm run build
